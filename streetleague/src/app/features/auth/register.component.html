<div class="min-h-screen bg-background-light flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <a routerLink="/" class="text-3xl font-bold text-primary text-center block mb-8">
      StreetLeague
    </a>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-xl rounded-lg sm:px-10">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-text-dark">Créez votre compte</h2>
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-6">
        <!-- Sélection du rôle -->
        <div>
          <label class="block text-sm font-medium text-text-dark mb-2">Je suis un(e)</label>
          <div class="grid grid-cols-2 gap-4">
            <button 
              type="button"
              (click)="selectedRole = 'player'"
              [class]="selectedRole === 'player' 
                ? 'bg-primary text-white border-primary' 
                : 'border-2 border-gray-200 text-text-dark hover:border-primary'"
              class="p-4 rounded-lg transition text-center"
            >
              <div class="font-semibold">Joueur</div>
              <div class="text-sm opacity-75">Je veux jouer</div>
            </button>

            <button 
              type="button"
              (click)="selectedRole = 'owner'"
              [class]="selectedRole === 'owner' 
                ? 'bg-primary text-white border-primary' 
                : 'border-2 border-gray-200 text-text-dark hover:border-primary'"
              class="p-4 rounded-lg transition text-center"
            >
              <div class="font-semibold">Propriétaire</div>
              <div class="text-sm opacity-75">Je possède un terrain</div>
            </button>
          </div>
        </div>

        <!-- Nom complet -->
        <div>
          <label class="block text-sm font-medium text-text-dark mb-1">Nom complet</label>
          <input 
            type="text"
            [(ngModel)]="name"
            name="name"
            required
            placeholder="Jean Dupont"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-text-dark mb-1">Email</label>
          <input 
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            email
            placeholder="votre.email@exemple.com"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
        </div>

        <!-- Mot de passe -->
        <div>
          <label class="block text-sm font-medium text-text-dark mb-1">Mot de passe</label>
          <input 
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
        </div>

        <!-- Confirmer mot de passe -->
        <div>
          <label class="block text-sm font-medium text-text-dark mb-1">Confirmer le mot de passe</label>
          <input 
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
          @if (password && confirmPassword && password !== confirmPassword) {
            <p class="text-red-600 text-sm mt-1">
              Les mots de passe ne correspondent pas
            </p>
          }
        </div>

        <!-- Bouton d'inscription -->
        <button 
          type="submit"
          [disabled]="!registerForm.valid || password !== confirmPassword"
          class="w-full bg-primary text-white py-3 rounded-lg hover:bg-primary-dark transition font-medium disabled:opacity-50"
        >
          Créer mon compte
        </button>

        <!-- Séparateur -->
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-text-light">ou</span>
          </div>
        </div>

        <!-- Lien vers connexion -->
        <div class="text-center text-sm">
          <span class="text-text-light">Vous avez déjà un compte ?</span>
          <a routerLink="/login" class="ml-1 text-primary hover:text-primary-dark font-medium">
            Connectez-vous
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
