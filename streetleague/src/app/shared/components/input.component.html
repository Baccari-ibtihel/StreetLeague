<div class="space-y-4">
  <!-- Default Input -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-text-dark">Email par défaut</label>
    <input 
      type="email" 
      placeholder="Enter your email" 
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition"
    >
  </div>

  <!-- Input with Error -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-text-dark">Email avec erreur</label>
    <input 
      type="email" 
      placeholder="Enter your email" 
      class="w-full px-4 py-3 border border-error rounded-lg focus:outline-none focus:ring-2 focus:ring-error/50 focus:border-error transition"
    >
    <p class="text-error text-sm mt-1">Format d'email invalide</p>
  </div>

  <!-- Disabled Input -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-text-dark">Email désactivé</label>
    <input 
      type="email" 
      placeholder="Enter your email" 
      disabled
      class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed"
    >
  </div>

  <!-- Input with Icon -->
  <div class="space-y-2">
    <label class="block text-sm font-medium text-text-dark">Email avec icône</label>
    <div class="relative">
      <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-text-light"></i>
      <input 
        type="email" 
        placeholder="Enter your email" 
        class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition"
      >
    </div>
  </div>
</div>
